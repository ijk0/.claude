    document.body.classList.remove('ld-is-expanded');
    expanded = null;
    $('ld-back').hidden = true; $('ld-exnav').hidden = true; $('ld-zoomctl').hidden = false; $('ld-pages').hidden = pageList.length < 2;
  }
  function back() {
    const file = expanded;
    closeExpanded();
    const b = boards.find((q) => q.file === file);
    if (!world.children.length || (b && b.page !== page)) showCanvas(b ? b.page : page);
    else { history.replaceState(null, '', pageList.length > 1 ? `#page=${encodeURIComponent(page)}` : location.pathname + location.search); saveView(); }
  }
  function stepExpanded(d) {
    const i = boards.findIndex((q) => q.file === expanded);
    expand(boards[(i + d + boards.length) % boards.length].file);
  }
  $('ld-back').addEventListener('click', back);
  $('ld-prev').addEventListener('click', () => stepExpanded(-1));
  $('ld-next').addEventListener('click', () => stepExpanded(1));
  $('ld-zoomin').addEventListener('click', () => { zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, view.z * 1.25); saveView(); });
  $('ld-zoomout').addEventListener('click', () => { zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, view.z / 1.25); saveView(); });
  $('ld-fit').addEventListener('click', () => { fit(); saveView(); });

  // ---------------------------------------------------------------- gestures
  const pointers = new Map();
  let gesture = null;
  let lastTap = { file: null, t: 0 };
  stage.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 && e.button !== 1) return;
    if (e.target.closest('.ld-chips') || e.target.closest('button')) return;
    if (e.isPrimary) { pointers.clear(); gesture = null; } // a lost pointerup must not turn the next press into a pinch
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    stage.setPointerCapture(e.pointerId);
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      gesture = { kind: 'pinch', d: Math.hypot(a.x - b.x, a.y - b.y), z: view.z };
      return;
    }
    const boardNode = e.target.closest('.ld-board');
    const onStrip = !!e.target.closest('.ld-strip');
    const panAll = document.body.classList.contains('ld-space') || e.button === 1;
    if (onStrip && !panAll) {
      const b = boards.find((q) => q.file === boardNode.dataset.file);
      gesture = { kind: 'move', b, el: boardNode, sx: e.clientX, sy: e.clientY, ox: b.x, oy: b.y, moved: false };
    } else {
      gesture = { kind: 'pan', sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y, moved: false,
        file: !panAll && boardNode && e.target.closest('.ld-shield') ? boardNode.dataset.file : null };
    }
  });
  stage.addEventListener('pointermove', (e) => {
    const p = pointers.get(e.pointerId);
    if (!p || !gesture) return;
    p.x = e.clientX; p.y = e.clientY;
    if (gesture.kind === 'pinch' && pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      const r = stage.getBoundingClientRect();
      zoomAt((a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top, gesture.z * Math.hypot(a.x - b.x, a.y - b.y) / gesture.d);
      return;
    }
    const dx = e.clientX - gesture.sx, dy = e.clientY - gesture.sy;
    if (!gesture.moved && Math.hypot(dx, dy) < 4) return;
    gesture.moved = true;
    document.body.classList.add('ld-panning');
    if (gesture.kind === 'move') {
      gesture.b.x = Math.round(gesture.ox + dx / view.z); gesture.b.y = Math.round(gesture.oy + dy / view.z);
      gesture.el.style.left = `${gesture.b.x}px`; gesture.el.style.top = `${gesture.b.y}px`;
    } else if (gesture.kind === 'pan') {
      view.x = gesture.vx + dx; view.y = gesture.vy + dy; apply();
    }
  });
  function endPointer(e) {
    if (!pointers.delete(e.pointerId)) return;
    if (pointers.size) return;
    document.body.classList.remove('ld-panning');
    const g = gesture;
    gesture = null;
    if (!g) return;
    if (g.kind === 'move' && !g.moved) {
      const now = Date.now();
      if (lastTap.file === g.b.file && now - lastTap.t < 350) { lastTap = { file: null, t: 0 }; expand(g.b.file); return; }
      lastTap = { file: g.b.file, t: now };
      select(g.b.file);
    } else if (g.kind === 'pan' && !g.moved) {
      select(g.file);
    }
    saveView();
  }
  stage.addEventListener('dblclick', (e) => {
    // pointer capture retargets dblclick to the stage: find the name strip under the pointer
    const strip = document.elementsFromPoint(e.clientX, e.clientY).find((el) => el.classList && el.classList.contains('ld-strip'));
    const boardNode = strip && strip.closest('.ld-board');
    if (boardNode) expand(boardNode.dataset.file);
  });
  stage.addEventListener('pointerup', endPointer);
  stage.addEventListener('pointercancel', endPointer);
  stage.addEventListener('wheel', (e) => {
    e.preventDefault();
    const r = stage.getBoundingClientRect();
    if (e.ctrlKey || e.metaKey) zoomAt(e.clientX - r.left, e.clientY - r.top, view.z * Math.exp(-Math.max(-50, Math.min(50, e.deltaY)) * 0.01));
    else { view.x -= e.deltaX; view.y -= e.deltaY; apply(); }
    clearTimeout(stage._t); stage._t = setTimeout(saveView, 200);
  }, { passive: false });
  addEventListener('keydown', (e) => {
    if (e.target.closest && e.target.closest('input, select, textarea')) return;
    if (expanded) {
      if (e.key === 'Escape') back();
      else if (e.key === 'ArrowLeft') stepExpanded(-1);
      else if (e.key === 'ArrowRight') stepExpanded(1);
      return;
    }
    if (e.key === ' ') { document.body.classList.add('ld-space'); e.preventDefault(); return; }
    const cx = stage.clientWidth / 2, cy = stage.clientHeight / 2;
    if (e.key === 'Escape') select(null);
    else if (e.key === '0') fit();
    else if (e.key === '1') zoomAt(cx, cy, 1);
    else if (e.key === '+' || e.key === '=') zoomAt(cx, cy, view.z * 1.25);
    else if (e.key === '-' || e.key === '_') zoomAt(cx, cy, view.z / 1.25);
    else return;
    saveView();
  });
  addEventListener('keyup', (e) => { if (e.key === ' ') document.body.classList.remove('ld-space'); });
  addEventListener('blur', () => document.body.classList.remove('ld-space'));
  addEventListener('resize', () => { if (expanded) expand(expanded); });

  // ---------------------------------------------------------------- start
  window.__ld = {
    title: TITLE,
    entry: entry ? entry.file : null,
    pages: pageList.map((p) => ({ id: p.id, name: p.name })),
    boards: boards.map((b) => ({ ...b })),
    resolve,
  };
  const hash = new URLSearchParams(location.hash.slice(1));
  const where = store.get('where');
  if (!boards.length) {
    world.textContent = 'This canvas has no .dc.html artboards.';
    window.__ldReady = true;
  } else if (hash.get('focus') && boards.some((b) => b.file === hash.get('focus'))) {
    showCanvas(boards.find((b) => b.file === hash.get('focus')).page);
    expand(hash.get('focus'));
  } else if (hash.has('page') || hash.has('fit')) {
    showCanvas(hash.get('page') ?? launch.page ?? (entry && entry.page), hash.has('fit'));
  } else if (where && where.focus && boards.some((b) => b.file === where.focus)) {
    showCanvas(boards.find((b) => b.file === where.focus).page);
    expand(where.focus);
  } else if (where && typeof where.page === 'string') {
    showCanvas(where.page);
  } else if (launch.view === 'focused' && boards.some((b) => b.file === launch.file)) {
    showCanvas(boards.find((b) => b.file === launch.file).page);
    expand(launch.file);
  } else {
    showCanvas(launch.page ?? (entry && entry.page));
  }
})();
</script>
</body>
</html>
